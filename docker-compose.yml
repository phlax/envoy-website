# NOTE: you must `export UID` before building

services:
  build:
    build:
      context: docker
      target: build
    environment:
      USER_UID: ${UID:?"`UID` must be set, try `export UID`"}
      HOME: /home/envoybuild
      BAZEL_BUILD_OPTIONS: ${BAZEL_BUILD_OPTIONS:-}
    volumes:
    - .:/src/workspace/envoy-website
    - ~/.cache/bazel:/home/envoybuild/.cache/bazel
    - ~/.cache/bazelisk:/home/envoybuild/.cache/bazelisk
    working_dir: /src/workspace/envoy-website
    entrypoint: ["/bin/bash", "-c"]
    command:
    - |
      usermod -u "$${USER_UID}" envoybuild >/dev/null
      chown envoybuild /proc/self/fd/2 2>/dev/null || true
      exec gosu envoybuild ./build-website.sh

  live:
    build:
      context: docker
      target: live
    volumes:
    - .:/src/workspace/envoy-website
    - ~/.cache/bazel:/home/envoybuild/.cache/bazel
    - ~/.cache/bazelisk:/home/envoybuild/.cache/bazelisk
    working_dir: /src/workspace/envoy-website
    environment:
      USER_UID: ${UID:?"`UID` must be set, try `export UID`"}
      HOME: /home/envoybuild
      BAZEL_BUILD_OPTIONS: ${BAZEL_BUILD_OPTIONS:-}
      DEBUG: ${DEBUG:-}
      RUN_ON_START: ${RUN_ON_START:-1}
      WATCH_COMMAND: inotify
    entrypoint: ["/bin/bash", "-c"]
    command:
    - |
      usermod -u "$${USER_UID}" envoybuild >/dev/null
      chown envoybuild /proc/self/fd/2 2>/dev/null || true
      exec gosu envoybuild ./rebuild.sh

  website:
    build:
      context: docker
      dockerfile: Dockerfile.website
    depends_on:
    - ${BUILDER:-build}
    command:
    - /bin/sh
    - -c
    - |
      cat <<EOF > /etc/nginx/conf.d/default.conf
      server {
          listen       8000;
          listen  [::]:8000;
          server_name  localhost;
          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
          }
      }
      EOF
      nginx -g 'daemon off;'
    volumes:
    - ./_site:/usr/share/nginx/html:z
    ports:
    - 8000:8000

  update:
    build:
      context: docker
      target: update
    volumes:
    - .:/src/workspace/envoy-website
    - ${ENVOY_SRC_DIR:-../envoy}:/src/workspace/envoy
    - ~/.cache/bazel:/home/envoybuild/.cache/bazel
    - ~/.cache/bazelisk:/home/envoybuild/.cache/bazelisk
    working_dir: /src/workspace/envoy-website
    environment:
      USER_UID: ${UID:?"`UID` must be set, try `export UID`"}
      HOME: /home/envoybuild
      BAZEL_BUILD_OPTIONS: ${BAZEL_BUILD_OPTIONS:-}
      ENVOY_SRC_DIR: ../envoy
      COMMITTER_NAME: ${COMMITTER_NAME:-}
      COMMITTER_EMAIL: ${COMMITTER_EMAIL:-}
    entrypoint: ["/bin/bash", "-c"]
    command:
    - |
      usermod -u "$${USER_UID}" envoybuild >/dev/null
      chown envoybuild /proc/self/fd/2 2>/dev/null || true
      exec gosu envoybuild ./sync_envoy.sh
