# NOTE: you must `export UID` before building

services:
  build:
    image: envoyproxy/envoy-build:devtools-v0.2.3
    environment:
      BUILD_UID: ${UID:?"`UID` must be set, try `export UID`"}
      USER_UID: ${UID:?"`UID` must be set, try `export UID`"}
      HOME: /home/envoybuild
      DOCKER_COMMAND: ./build-website.sh
      BAZEL_BUILD_OPTIONS: ${BAZEL_BUILD_OPTIONS:-}
    volumes:
    - .:/src/workspace/envoy-website
    - ~/.cache/bazel:/home/envoybuild/.cache/bazel
    - ~/.cache/bazelisk:/home/envoybuild/.cache/bazelisk
    working_dir: /src/workspace/envoy-website
    entrypoint: ["/bin/bash", "-c"]
    command:
    - |
      usermod -u "$${USER_UID}" envoybuild >/dev/null
      chown envoybuild /proc/self/fd/2 2>/dev/null || true
      exec gosu envoybuild ./build-website.sh


  live:
    build:
      context: &context https://github.com/envoyproxy/toolshed.git#f6cc2e99964fcec26d4e497d7e41cca502e7241e:docker/bazel
      target: extra
      args:
        USER_NAME: "${USER}"
        USER_ID: &uid "${UID}"
        GROUP_ID: &gid "${GID:-}"
        APT_PKGS: &apt_pkgs >-
          autoconf
          automake
          bison
          build-essential
          gawk
          git
          gnupg2
          libffi-dev
          libgdbm-dev
          libgmp-dev
          libncurses5-dev
          libreadline-dev
          libsqlite3-dev
          libssl-dev
          libtool
          libyaml-dev
          pkg-config
          sqlite3
          zlib1g-dev
        EXTRA_APT_PKGS: >-
          inotify-tools
    command: ./rebuild.sh
    user: ${UID:?"`UID` must be set, try `export UID`"}:${GID:-}
    volumes: &volumes
    - .:/src/workspace/envoy-website
    - ~/.cache/bazel:$HOME/.cache/bazel
    - ~/.cache/bazelisk:$HOME/.cache/bazelisk
    working_dir: /src/workspace/envoy-website
    environment:
      BAZEL_BUILD_OPTIONS: &bazel_options ${BAZEL_BUILD_OPTIONS:-}
      DEBUG: ${DEBUG:-}
      RUN_ON_START: ${RUN_ON_START:-1}
      WATCH_COMMAND: inotify

  website:
    image: nginx
    depends_on:
    - ${BUILDER:-build}
    command:
    - /bin/sh
    - -c
    - |
      cat <<EOF > /etc/nginx/conf.d/default.conf
      server {
          listen       8000;
          listen  [::]:8000;
          server_name  localhost;
          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
          }
      }
      EOF
      nginx -g 'daemon off;'
    volumes:
    - ./_site:/usr/share/nginx/html:z
    ports:
    - 8000:8000

  update:
    build:
      context: docker
      dockerfile: Dockerfile
      args:
        USER_NAME: "${USERNAME}"
        USER_ID: "${UID}"
        GROUP_ID: "${GID:-}"
    command: ./sync_envoy.sh
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
    - .:/src/workspace/envoy-website
    - ${ENVOY_SRC_DIR:-../envoy}:/src/workspace/envoy
    - ~/.cache/bazel:/$HOME/.cache/bazel
    - ~/.cache/bazelisk:/$HOME/.cache/bazelisk
    working_dir: /src/workspace/envoy-website
    environment:
      ENVOY_SRC_DIR: ../envoy
      COMMITTER_NAME: ${COMMITTER_NAME:-}
      COMMITTER_EMAIL: ${COMMITTER_EMAIL:-}
